booking:
  # 좌석을 선점한 뒤 결제까지 주어지는 시간. 지나면 선점이 만료되고 좌석이 다시 팔린다.
  # 짧으면 결제하다 놓치는 사람이 늘고, 길면 남은 좌석이 오래 묶인다. 이 값이 무엇을 바꾸는지는 Step 3에서 다시 본다.
  hold-duration: 5m

spring:
  application:
    name: ticketing
  jpa:
    hibernate:
      # 스키마는 Flyway(db/migration)가 만든다. Hibernate는 엔티티와 테이블이 맞는지만 확인하고, 어긋나면 기동을 멈춘다.
      ddl-auto: validate
    # 트랜잭션이 끝난 뒤 컨트롤러·뷰에서 지연 로딩이 일어나지 않게 한다. 켜두면 요청 내내 DB 커넥션을 붙잡는다.
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        # HTTP로 여는 Actuator 엔드포인트. 기본값은 health뿐이라 metrics를 더한다.
        # 커넥션 풀 보기: /actuator/metrics/hikaricp.connections.active (사용 중), .pending (커넥션을 기다리는 스레드)
        # env·beans처럼 설정·내부 구조를 드러내는 엔드포인트는 열지 않는다.
        include: health, metrics

logging:
  pattern:
    # 로그 줄마다 요청 ID(RequestIdFilter가 MDC에 넣은 값)를 찍어, 동시 요청의 로그가 뒤섞여도 어느 요청의 것인지 가른다.
    # Boot 기본 패턴에서 추적 ID가 들어가는 자리다. 시각(ms)·스레드 이름은 기본 패턴에 이미 있다.
    # 요청 밖(기동·스케줄러)에서 나온 로그는 ID 없이 []로 찍힌다.
    correlation: "[%X{requestId:-}] "
