plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '8.10.2'
}

group = 'com.ticketing'
version = '0.0.1-SNAPSHOT'
description = '좌석 예매 - 모듈러 모놀리식 학습 프로젝트'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-mysql'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

// 'reproduction' 태그는 아직 못 고친 문제를 일부러 실패로 두는 재현 테스트다.
// 기본 test에 포함하면 CI가 상시 실패하므로 제외하고, 해당 Step에서 고치면 태그를 뗀다.
tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'reproduction'
	}
}

// 재현 테스트만 돌린다: ./gradlew reproductionTest (실패가 정상이라 빌드를 세우지 않는다)
tasks.register('reproductionTest', Test) {
	group = 'verification'
	description = '아직 해결되지 않은 문제를 재현하는 테스트'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'reproduction'
	}
	ignoreFailures = true
}

// 포맷 검사는 check(→ build)에 자동으로 걸린다. 고치기: ./gradlew spotlessApply
spotless {
	java {
		target 'src/**/*.java'
		// javadoc은 포맷하지 않는다. 켜두면 문단마다 <p>를 넣어, 주석에 HTML 태그를 쓰지 않는 규칙과 부딪힌다.
		googleJavaFormat('1.36.1').formatJavadoc(false)
		trimTrailingWhitespace()
		endWithNewline()
	}
}
