name: build

on:
  # feature/release 브랜치는 PR로 검사한다. push에도 걸면 같은 커밋을 두 번 빌드한다.
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# 같은 브랜치에 새 푸시가 오면 진행 중인 실행을 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 워크플로 파일 자체의 오류를 잡는다.
  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  # 포맷 위반은 테스트를 기다리지 않고 바로 알린다.
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
      - name: Spotless check
        run: ./gradlew spotlessCheck --console=plain

  # 컴파일 + 테스트. Testcontainers가 쓰는 Docker는 ubuntu-latest 러너에 이미 있다.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
      # 포맷은 format job이 본다.
      - name: Build and test
        run: ./gradlew build -x spotlessCheck --console=plain
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/test
          retention-days: 7
